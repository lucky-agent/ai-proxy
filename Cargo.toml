[package]
name = "ai-proxy"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.1"

[dependencies]
tokio = { version = "1", features = [
  "fs",
  "time",
  "macros",
  "rt",
  "rt-multi-thread",
  "signal",
  "sync",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

rama = { git = "https://github.com/plabayo/rama", features = [
  "http-full",
  "rustls",
  "ring",
] }
bytes = "1"
uuid = { version = "1", features = ["v4"] }
