[package]
name         = "ai-proxy"
version      = "0.1.0"
description  = "AI Proxy - Anthropic/OpenAI API MITM Proxy"
authors      = ["lokistars"]
edition      = "2024"
rust-version = "1.96.0"

[lib]
name       = "ai_proxy_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = [
  "fs",
  "time",
  "macros",
  "rt",
  "rt-multi-thread",
  "signal",
  "sync",
] }
log = "0.4"
tauri-plugin-log = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
time = { version = "0.3", features = ["formatting", "local-offset"] }
rama = { git = "https://github.com/plabayo/rama", features = [
  "http-full",
  "rustls",
  "ring",
  "dns",
] }
bytes = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.23"
rcgen = { version = "0.14", features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
rquickjs = { version = "0.12" }
sqlite = "0.37.0"
open = "5"
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "unwind"
strip = "symbols"
